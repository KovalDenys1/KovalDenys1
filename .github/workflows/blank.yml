name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: KovalDenys1
          outputs: |
            dist/github-snake.svg?color_snake=#ff8a5c&color_dots=#ebedf0,#b9f0df,#82e0c4,#3fb995,#1a7a62
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff8a5c&color_dots=#161b22,#0e4a3d,#1a7a62,#3fb995,#6fe3c1

      - uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=KovalDenys1&hide_border=true&border_radius=24&background=0F141D&stroke=1F2A33&ring=6FE3C1&fire=FF8A5C&currStreakLabel=6FE3C1&sideLabels=C4CEDB&currStreakNum=EEF4FA&sideNums=EEF4FA&dates=7D8899&disable_animations=true
          path: dist/streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
