name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: KovalDenys1
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=KovalDenys1&hide_border=true&background=0D1117&stroke=0D1117&ring=7AA2F7&fire=7AA2F7&currStreakLabel=7AA2F7&sideLabels=C9D1D9&currStreakNum=C9D1D9&sideNums=C9D1D9&dates=C9D1D9&disable_animations=true
          path: dist/streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate typing SVG (falls back to last good copy if the live demo is down)
        run: |
          curl -fsSL "https://readme-typing-svg.demolab.com?font=Inter&weight=600&size=42&duration=2400&pause=900&color=E6EDF3&center=true&vCenter=true&width=560&height=65&lines=Hey%2C+I%27m+Denys." -o dist/typing.svg \
          || curl -fsSL "https://raw.githubusercontent.com/KovalDenys1/KovalDenys1/output/typing.svg" -o dist/typing.svg

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
